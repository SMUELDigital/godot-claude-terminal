name: Release

# Push a tag like v1.1.0 to build claude_terminal.zip and attach it to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build zip
        run: zip -r claude_terminal.zip addons/claude_terminal
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: claude_terminal.zip
          generate_release_notes: true
